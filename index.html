<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>VapeCycle — Relacionamiento y análisis del contexto</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #F2705C;
            --bg-mid: #17110F;
            --bg-purple: #F9D9C4;
            --lime: #C8F23B;
            --green: #1F5C3D;
            --green-deep: #1F5C3D;
            --pink: #F27BB5;
            --teal: #4BB3E6;
            --orange: #F59E3A;
            --lav: #8B5CF6;
            --cream: #FFF6EC;
            --ink: #17110F;
            --violet: var(--lav);
            --sky: var(--teal);
            --pine: var(--green);
            --coral: #EF7A5C;
            --paper: var(--cream);
            --display: 'Baloo 2', sans-serif;
            --body: 'Plus Jakarta Sans', sans-serif;
            box-sizing: border-box
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--body);
            color: var(--ink);
            background: var(--bg-deep);
            overflow: hidden
        }

        h2,
        h3,
        .disp {
            font-family: var(--display)
        }

        ::selection {
            background: var(--lime);
            color: var(--ink)
        }

        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none
        }

        .backdrop::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(90% 70% at 10% 0%, var(--bg-purple), transparent 65%), radial-gradient(90% 80% at 100% 100%, rgba(139, 92, 246, .55), transparent 60%), linear-gradient(160deg, #F58468, var(--bg-deep) 60%, #E85D4A)
        }

        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(23, 17, 15, .13) 1px, transparent 1.4px);
            background-size: 22px 22px;
            opacity: .5
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35
        }

        .b1 {
            width: 420px;
            height: 420px;
            background: #FBE9DC;
            top: -120px;
            left: -100px
        }

        .b2 {
            width: 460px;
            height: 460px;
            background: var(--lav);
            bottom: -160px;
            right: -120px
        }

        .b3 {
            width: 340px;
            height: 340px;
            background: var(--lime);
            top: 38%;
            left: 60%;
            opacity: .18
        }

        main#deck {
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--ink) transparent;
            padding-top: env(safe-area-inset-top, 0px)
        }

        .s {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: start;
            padding: 8vh 8vw
        }

        .w {
            max-width: 1220px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.1rem
        }

        h2 {
            font-weight: 700;
            font-size: clamp(1.9rem, 4.2vw, 2.9rem);
            line-height: 1.08;
            margin: 0
        }

        .tag {
            display: inline-flex;
            font-family: var(--display);
            font-weight: 700;
            font-size: .85rem;
            background: var(--lime);
            color: var(--ink);
            border-radius: 8px;
            padding: .2rem .55rem;
            margin-right: .7rem;
            vertical-align: middle
        }

        .h1 {
            font-family: var(--display);
            font-weight: 700;
            font-size: clamp(2.6rem, 7vw, 5rem);
            line-height: 1.02;
            margin: 0
        }

        .sub {
            margin: 0;
            font-size: clamp(1rem, 1.5vw, 1.15rem);
            line-height: 1.6;
            max-width: 62ch;
            opacity: .92
        }

        .g {
            display: grid;
            gap: 1.1rem
        }

        .g2 {
            grid-template-columns: repeat(2, 1fr)
        }

        .g3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .g4 {
            grid-template-columns: repeat(4, 1fr)
        }

        @media(max-width:900px) {

            .g2,
            .g3,
            .g4 {
                grid-template-columns: 1fr
            }

            .s {
                padding: 9vh 6vw
            }
        }

        .c {
            background: var(--cream);
            color: var(--ink);
            border-radius: 16px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .3);
            padding: .9rem 1.1rem;
            font-size: .92rem;
            line-height: 1.45
        }

        .c.k {
            border-top: 5px solid var(--a, var(--lav))
        }

        .c h3 {
            margin: 0 0 .3rem;
            font-weight: 700;
            font-size: 1.15rem
        }

        .c ul {
            margin: 0;
            padding-left: 1.1rem
        }

        .c li {
            margin: .15rem 0
        }

        .glass {
            background: rgba(255, 246, 236, .55);
            border: 2px solid var(--ink);
            border-radius: 20px;
            backdrop-filter: blur(14px)
        }

        .who {
            display: flex;
            gap: .65rem;
            align-items: center;
            margin-bottom: .6rem
        }

        .av {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--a);
            color: var(--ink);
            display: grid;
            place-items: center;
            font-family: var(--display);
            font-weight: 700;
            flex: none
        }

        .who b {
            font-family: var(--display);
            line-height: 1.15
        }

        .who small {
            display: block;
            opacity: .65;
            font-size: .74rem;
            line-height: 1.2
        }

        q {
            display: block;
            font-style: normal;
            quotes: none
        }

        .find {
            margin-top: .6rem;
            background: var(--lime);
            border-radius: 8px;
            padding: .25rem .55rem;
            font-size: .8rem;
            font-weight: 700
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--cream);
            color: var(--ink);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .3);
            font-size: .9rem
        }

        th {
            background: var(--bg-mid);
            color: var(--lime);
            text-align: left;
            padding: .65rem .9rem;
            font-family: var(--display);
            font-weight: 600
        }

        td {
            padding: .6rem .9rem;
            border-top: 1px solid rgba(36, 23, 51, .14);
            vertical-align: top;
            line-height: 1.4
        }

        td:first-child {
            font-family: var(--display);
            font-weight: 700
        }

        .tw {
            overflow-x: auto;
            border-radius: 16px
        }

        .tw table {
            min-width: 640px
        }

        .chip {
            display: inline-block;
            border-radius: 100px;
            padding: .1rem .7rem;
            font-family: var(--display);
            font-weight: 600;
            font-size: .8rem;
            background: var(--a, var(--lime))
        }





        .tree {
            display: flex;
            flex-direction: column;
            gap: .5rem
        }

        .ar {
            text-align: center;
            font-family: var(--display);
            font-weight: 700;
            color: var(--ink);
            font-size: .95rem
        }

        .emp {
            grid-template-columns: 1fr 1fr 1fr
        }

        .emp .me {
            grid-row: span 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            background: var(--lime)
        }

        @media(max-width:900px) {
            .emp {
                grid-template-columns: 1fr
            }

            .emp .me {
                grid-row: auto
            }
        }

        svg text {
            font-family: var(--body);
            font-weight: 700
        }

        .progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 60
        }

        .pf {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--pink), var(--lime), var(--teal))
        }

        .counter {
            position: fixed;
            left: 8vw;
            bottom: 2.2rem;
            font-family: var(--display);
            font-weight: 600;
            font-size: .82rem;
            opacity: .75;
            z-index: 55
        }

        .dots {
            position: fixed;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: .5rem;
            z-index: 60
        }

        .dot-btn {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid var(--ink);
            background: none;
            padding: 0;
            cursor: pointer;
            transition: .25s
        }

        .dot-btn.active {
            background: var(--lime);
            border-color: var(--ink);
            transform: scale(1.4)
        }

        .nav-btn {
            position: fixed;
            right: 1.4rem;
            z-index: 60;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid var(--ink);
            background: rgba(255, 246, 236, .6);
            color: var(--ink);
            cursor: pointer;
            backdrop-filter: blur(6px);
            font-size: .8rem
        }

        #pv {
            bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px))
        }

        #nx {
            bottom: calc(2rem + env(safe-area-inset-bottom, 0px))
        }

        button:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px
        }

        @media(max-width:900px) {
            .dots {
                display: none
            }

            .counter {
                left: 6vw
            }
        }

        @media(prefers-reduced-motion:reduce) {
            main#deck {
                scroll-behavior: auto
            }

            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="backdrop">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
    </div>
    <div class="progress">
        <div class="pf" id="pf"></div>
    </div>
    <div class="counter" id="cnt"></div>
    <div class="dots" id="dots"></div>
    <main id="deck"></main>
    <button class="nav-btn" id="pv" aria-label="Anterior">▲</button><button class="nav-btn" id="nx"
        aria-label="Siguiente">▼</button>
    <script>
        const T = (h, r) => `<div class="tw"><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${r.map(a => `<tr>${a.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
        const H = (t, n, s) => `<h2>${n ? `<span class="tag">${n}</span>` : ''}${t}</h2>${s ? `<p class="sub">${s}</p>` : ''}`;
        const L = a => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
        const C = (t, b, a) => `<div class="c k" style="--a:${a || 'var(--violet)'}"><h3>${t}</h3>${b}</div>`;
        const voices = [['Juliana R.', 'Estudiante, usuaria frecuente', 'J', 'var(--pink)', 'Cuando se acaba lo boto a la caneca más cercana. Nunca he visto un punto especial para esto, y la verdad tampoco lo he buscado.', 'Sin punto visible, no hay hábito.'],
        ['Don Albeiro M.', 'Servicios generales, 12 años en la EIA', 'A', 'var(--orange)', 'Casi todos los días saco dos o tres vapeadores de las canecas normales. Nadie nos ha dicho qué hacer si uno se rompe en la bolsa.', 'Riesgo real y sin protocolo para aseo.'],
        ['Camila S.', 'Bienestar y Sostenibilidad EIA', 'C', 'var(--sky)', 'Apoyamos iniciativas estudiantiles de economía circular, pero necesitamos ver primero un protocolo claro para materiales peligrosos.', 'Apoyo institucional condicionado.'],
        ['Andrés F.', 'Semillero de manufactura aditiva', 'A', 'var(--violet)', 'Nos encantaría probar filamento reciclado en nuestras impresoras, pero necesitamos saber que el material es consistente.', 'Aliado técnico si hay pruebas de calidad.'],
        ['Laura T.', 'Grupo estudiantil ambiental', 'L', 'var(--lime)', 'La mayoría de mis compañeros no sabe que el vapeador tiene una batería de litio adentro. Falta contarlo, no solo poner una caneca.', 'Falta educación, no solo infraestructura.']];
        const S = [];
        S.push(`<div class="s"><div class="w"><span class="chip" style="align-self:flex-start;padding:.25rem .9rem">Innovación social · Universidad EIA</span><h1 class="h1">Vape Cycle<br></h1><p class="sub"><b>Escuchamos el campus antes de proponer</b></br>Relacionamiento, evidencia y mapas detrás de <b>VapeCycle — Reutiliza tu vapo</b>: cómo llegamos del problema de los vapeadores desechables a una solución con sentido para la comunidad EIA.</p><div class="c" style="align-self:flex-start;max-width:640px"><b>María José Muñoz · Daniel Barth · Ricardo Vélez · Anniela Galvis · Mariana Lemus</b><br>Docente: Daniela López Montoya · Medellín, 2026</div></div></div>`);
        S.push(H('¿Dónde encaja el problema?', '', 'El problema conceptual vive en el cruce de tres fenómenos que casi siempre se atienden por separado en un campus.') + `<div class="g g3">${C('Consumo juvenil en crecimiento', 'Los vapeadores desechables son parte del día a día de jóvenes y universitarios. Solo en EE. UU. se descartan cerca de 500.000 al día.', 'var(--pink)')}${C('Un RAEE sin ruta clara', 'Mezcla plástico, metal, circuitos, líquido y batería de litio, pero se bota con la basura común o el reciclaje doméstico.', 'var(--orange)')}${C('Economía circular con lugar real', 'La EIA tiene laboratorios y un semillero capaces de cerrar el ciclo del plástico sin salir del campus.', 'var(--pine)')}</div><div class="c" style="background:var(--lime)"><b>Problema conceptual:</b> los vapeadores desechables se acumulan y se disponen mal, con riesgo de incendio y pérdida de recursos, sin que la comunidad tenga cómo actuar distinto.</div>`);
        S.push(H('PESTEL', '', 'Seis fuerzas externas que condicionan el proyecto.') + `<div class="g g3">${C('Político', '<ul><li>Agenda ODS 12 y 13 en la educación superior</li><li>Política nacional de RAEE (Ley 1672 de 2013)</li></ul>', 'var(--violet)')}${C('Económico', '<ul><li>Metales y componentes con valor de reventa</li><li>Filamento 3D comercial tiene costo recurrente</li><li>Presupuesto estudiantil limitado</li></ul>', 'var(--orange)')}${C('Social', '<ul><li>Consumo normalizado entre jóvenes</li><li>Poca cultura de disposición de electrónicos</li><li>Desconocen que hay batería de litio</li></ul>', 'var(--pink)')}${C('Tecnológico', '<ul><li>Trituración y extrusión de filamento accesibles</li><li>Impresión 3D activa en la EIA</li><li>Falta caracterizar el plástico</li></ul>', 'var(--sky)')}${C('Ecológico', '<ul><li>Plástico que no se degrada</li><li>Líquidos residuales y litio al suelo y al agua</li><li>Incendios por baterías aplastadas</li></ul>', 'var(--pine)')}${C('Legal', '<ul><li>Baterías y electrónicos van a gestor autorizado</li><li>Residuos peligrosos: Decreto 1076 de 2015</li><li>Posconsumo de pilas: Res. 1297 de 2010</li></ul>', 'var(--coral)')}</div>`);
        S.push(H('Ejercicio de relacionamiento', '', 'Cinco conversaciones, cinco miradas sobre el ciclo de vida del vapeador en la EIA.') + `<div class="g g2"><div class="c"><h3>Cómo lo hicimos</h3>${L(['<b>Observación en campus:</b> cafeterías y zonas comunes, para ver dónde termina un vapeador.', '<b>5 entrevistas semiestructuradas</b> de 10 a 15 min, en agosto de 2026.', '<b>Registro de evidencia:</b> cada hallazgo quedó como frase o hecho rastreable.'])}<p style="margin:.6rem 0 0">Roles: <span class="chip" style="--a:var(--pink)">consume</span> <span class="chip" style="--a:var(--orange)">recoge</span> <span class="chip" style="--a:var(--sky)">decide</span> <span class="chip" style="--a:var(--violet)">aprovecha</span> <span class="chip">sensibiliza</span></p></div><div class="c"><h3>Preguntas base</h3>${L(['¿Qué haces hoy con un vapeador agotado y por qué?', '¿Sabes de qué está hecho y qué riesgos tiene?', '¿Qué te haría usar un punto de entrega?', '¿Qué necesitarías para apoyar o participar?', '¿Qué te preocuparía de este proyecto?'])}</div></div>`);
        S.push(H('Evidencia recogida: voces del campus', '', 'Testimonios reconstruidos a partir de las entrevistas.') + `<div class="g g3">${voices.map(v => `<div class="c bub" style="--a:${v[3]}"><div class="who"><div class="av">${v[2]}</div><div><b>${v[0]}</b><small>${v[1]}</small></div></div><q>«${v[4]}»</q><div class="find">Hallazgo: ${v[5]}</div></div>`).join('')}</div>`);
        S.push(H('Evidencia relevante e implicación', '1.1', 'Lo que escuchamos, traducido en decisiones de diseño.') + T(['Evidencia', 'Implicación para VapeCycle'], [['El personal de aseo encuentra vapeadores en las canecas casi a diario.', 'La recolección debe integrarse a las rutinas de aseo, no depender de que el estudiante busque un punto.'], ['La mayoría de estudiantes no sabía que hay batería de litio.', 'El punto de recolección necesita un componente educativo visible.'], ['Bienestar y Sostenibilidad apoyan si hay protocolo de materiales peligrosos.', 'Definir desde el piloto cómo se entregan las baterías a un gestor autorizado.'], ['El semillero ve valor en el filamento reciclado, pero pide pruebas de calidad.', 'La validación técnica del plástico es requisito de entrada, no un paso opcional.']]));
        S.push(H('Qué revela el contexto', '1.2', 'Lo que el propio campus nos mostró.') + `<div class="g g2">${['No hay ningún punto de recolección diferenciado para vapeadores en el campus.', 'El consumo se concentra en afueras de cafeterías y zonas comunes entre clases.', 'La EIA ya tiene un semillero de manufactura aditiva: ventaja técnica frente a otros campus.', 'Hay apertura institucional, pero condicionada a un protocolo de seguridad.', 'El aseo asume un riesgo que nadie le reconoce ni le prepara.', 'Los estudiantes no rechazan reciclar, les falta información y cercanía.'].map((t, i) => `<div class="c" style="--a:${['var(--pink)', 'var(--orange)', 'var(--pine)', 'var(--sky)', 'var(--coral)', 'var(--violet)'][i]};border-left:12px solid var(--a)">${t}</div>`).join('')}</div>`);
        S.push(H('Matriz DOFA', '', 'Síntesis del contexto: qué tenemos, qué nos falta, qué se abre y qué amenaza.') + `<div class="g g2">${C('Fortalezas', '<ul><li>Semillero y laboratorios de manufactura aditiva</li><li>Comunidad concentrada y zonas de consumo identificables</li><li>Diseño seguro: no se manipulan baterías</li></ul><b>FO:</b> usar los equipos de la EIA para cerrar el ciclo del plástico.', 'var(--pine)')}${C('Oportunidades', '<ul><li>Apoyo condicionado de Bienestar y Sostenibilidad</li><li>Normativa RAEE y agenda ODS a favor</li><li>Ingresos por metales y posible replicación en otras universidades</li></ul><b>DO:</b> alianza con gestor autorizado para suplir experiencia y financiar.', 'var(--sky)')}${C('Debilidades', '<ul><li>Sin experiencia previa en manejo de RAEE</li><li>Plástico sin caracterizar todavía</li><li>Presupuesto estudiantil y dependencia de un gestor externo</li></ul><b>FA:</b> protocolo escrito y piloto pequeño antes de escalar.', 'var(--orange)')}${C('Amenazas', '<ul><li>Incendio si una batería se daña</li><li>Baja participación o estigma por vapear</li><li>Plásticos mezclados que impidan hacer filamento</li></ul><b>DA:</b> educación sin juicio y pruebas de material antes de producir.', 'var(--coral)')}</div>`);
        S.push(H('Causas, problema y efectos', '1.3') + `<div class="tree"><div class="g g4">${['Riesgo de incendio para el personal de aseo', 'Pérdida de materiales recuperables', 'Posible contaminación de suelo y agua', 'Se pierde una oportunidad de aprendizaje'].map(t => `<div class="c" style="background:#CFE9B8">${t}</div>`).join('')}</div><div class="ar">▲ EFECTOS ▲</div><div class="c" style="background:var(--ink);color:var(--lime);text-align:center;font-weight:700;font-size:1.1rem">Los vapeadores desechables se acumulan y se disponen mal dentro del campus EIA.</div><div class="ar">▲ CAUSAS ▲</div><div class="g g4">${['Faltan puntos de recolección diferenciados', 'Poco conocimiento del riesgo de la batería', 'Vapeadores baratos y fáciles de conseguir', 'Sin protocolo institucional visible'].map(t => `<div class="c" style="background:#E7D3B8">${t}</div>`).join('')}</div></div>`);
        S.push(H('Necesidades identificadas', '1.4') + T(['Necesidad', 'Evidencia', 'Implicación'], [['Punto de recolección seguro y visible', 'Juliana y Don Albeiro: no hay lugar claro donde dejarlo', 'Contenedores señalizados en zonas de mayor consumo'], ['Protocolo para baterías y electrónicos', 'Exigencia de Bienestar; WEEE Forum y EPA', 'Alianza formal con gestor autorizado desde el piloto'], ['Validación técnica del plástico', 'Petición del semillero de manufactura aditiva', 'Pruebas piloto obligatorias antes de producir a escala'], ['Educación visible sobre el riesgo', 'Desconocimiento entre estudiantes (Laura T.)', 'Comunicación integrada al punto de recolección']]));
        S.push(H('Mapa de actores', '', 'Quién rodea a VapeCycle y qué tan cerca está de la operación.') + `<div class="glass" style="padding:.5rem"><svg id="map" viewBox="0 0 720 470" role="img" aria-label="Mapa de actores" style="width:100%;height:auto;max-height:62vh"></svg></div>`);
        S.push(H('Malla receptora', '', 'Cómo cada actor recibe y aporta valor.') + T(['Actor', 'Qué necesita', 'Qué aporta', 'Rol'], [['Estudiantes consumidores', 'Un punto de entrega cercano, sin fricción', 'Volumen constante de vapeadores', 'Usuario principal'], ['Personal de aseo', 'Protocolo claro para manipular baterías', 'Conocimiento del terreno y las rutinas', 'Aliado operativo'], ['Bienestar / Sostenibilidad EIA', 'Evidencia de manejo documentado', 'Respaldo, permisos y visibilidad', 'Patrocinador del piloto'], ['Semillero de manufactura aditiva', 'Plástico caracterizado y confiable', 'Equipos de trituración/extrusión y laboratorio', 'Socio técnico'], ['Comunidad ambiental estudiantil', 'Un proyecto tangible en el cual participar', 'Campañas y voluntariado', 'Aliado de comunicación'], ['Gestores RAEE (externos)', 'Volumen agregado y separado', 'Disposición legal y segura de baterías', 'Receptor final']]));
        S.push(H('Mapa de empatía: Juliana', '', 'Persona primaria: a quien VapeCycle debe convencer, sin juzgarla.') + `<div class="g emp"><div class="c me"><div class="av" style="width:74px;height:74px;font-size:2rem;margin:0 auto .5rem;--a:var(--pink)">J</div><h3>Juliana</h3>Estudiante que vapea varias veces por semana entre clases.</div>${[['Dice y hace', '«Lo boto a la caneca más cercana»', "Usa el vapeador entre clases", 'var(--pink)'], ['Piensa y siente', 'Cree que no hace un daño grave', 'Algo de culpa, pero no ve alternativa clara', 'var(--violet)'], ['Ve', 'Canecas comunes sin señalización', 'Otros estudiantes botándolo igual', 'var(--sky)'], ['Oye', 'Que vapear es «malo», poco sobre cómo desecharlo', 'Noticias sueltas de incendios por baterías', 'var(--orange)'], ['Esfuerzos', 'No quiere gastar tiempo buscando un punto', 'No quiere sentirse juzgada', 'var(--coral)'], ['Resultados', 'Un punto cercano y fácil de usar', 'Sentir que su vapeador sirve para algo', 'var(--pine)']].map(e => C(e[0], L([e[1], e[2]]), e[3])).join('')}</div>`);
        S.push(H('Problema · Oportunidad · Solución', '1.5') + `<div class="g g3">${C('Problema', 'Los vapeadores desechables se acumulan y se disponen mal en la EIA, se mezclan con la basura común y se pierden materiales aprovechables.', 'var(--coral)')}${C('Oportunidad', 'Consumo concentrado, comunidad técnica (manufactura aditiva, ingeniería) e interés institucional en sostenibilidad: un ecosistema para cerrar el ciclo dentro del campus.', 'var(--lime)')}${C('Solución', 'VapeCycle: recolección señalizada, separación responsable, baterías y electrónicos a gestores autorizados, validación del plástico y filamento 3D de uso interno.', 'var(--pine)')}</div><div class="c" style="background:var(--bg-mid);color:var(--lime);font-weight:700;text-align:center">Cada contenedor, alianza y filamento responde a algo que el campus ya nos mostró.</div>`);
        S.push(`<div class="s on-end"><div class="w" style="align-items:center;text-align:center"><h2 style="font-size:clamp(2.4rem,6.5vw,4.6rem)">Ahora sabemos qué construir y para quién</h2><p class="sub">Siguiente paso: prototipar VapeCycle y validar el plástico en el piloto.</p><span class="chip" style="font-size:1rem;padding:.3rem 1.2rem">♻ Vape Cycle = residuo que vuelve como recurso</span></div></div>`);
        const D = document.getElementById('deck');
        D.innerHTML = S.map((h, i) => h.startsWith('<div class="s') ? h.replace('class="s', 'class="s" data-i="' + i + '" data-x="').replace(/data-x="([^"]*)"/, 'data-x="$1"') : `<section class="s" data-i="${i}"><div class="w">${h}</div></section>`).join('');
        const E = [...D.children]; E.forEach(e => e.classList.remove('on-end'));
        (function () {
            const svg = document.getElementById('map'), cx = 360, cy = 235; let o = '';
            [[300, 205, 'rgba(255,246,236,.25)'], [215, 145, 'rgba(255,246,236,.4)'], [120, 78, 'rgba(255,246,236,.7)']].forEach(r => o += `<ellipse cx="${cx}" cy="${cy}" rx="${r[0]}" ry="${r[1]}" fill="${r[2]}" stroke="#17110F" stroke-width="1.5" stroke-dasharray="6 5"/>`);
            o += `<circle cx="${cx}" cy="${cy}" r="34" fill="#C8F23B" stroke="#17110F" stroke-width="3"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="12" fill="#17110F">VapeCycle</text>`;
            [['Estudiantes', 1, 200, '#F27BB5'], ['Personal de aseo', 1, 340, '#F59E3A'], ['Bienestar / Sostenibilidad', 2, 265, '#4BB3E6'], ['Semillero 3D', 2, 25, '#B79BF7'], ['Grupo ambiental', 2, 155, '#C8F23B'], ['Gestores RAEE (externos)', 3, 300, '#EF7A5C'], ['Docente y programa', 3, 150, '#FFF7EE']].forEach(a => {
                const R = [0, [120, 78], [215, 145], [300, 205]][a[1]], x = cx + R[0] * Math.cos(a[2] * Math.PI / 180), y = cy + R[1] * Math.sin(a[2] * Math.PI / 180), w = a[0].length * 7.4 + 18;
                o += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#17110F" stroke-width="1.2" opacity=".35"/><rect x="${x - w / 2}" y="${y - 14}" width="${w}" height="28" rx="14" fill="${a[3]}" stroke="#17110F" stroke-width="2.5"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" fill="#17110F">${a[0]}</text>`
            });
            o += `<text x="14" y="455" font-size="11" fill="#17110F">Anillo interior: operación diaria · medio: aliados · exterior: apoyo y externos</text>`; svg.innerHTML = o
        })();
        const dots = document.getElementById('dots'), cnt = document.getElementById('cnt'), pf = document.getElementById('pf');
        dots.innerHTML = E.map((_, k) => `<button class="dot-btn" aria-label="Diapositiva ${k + 1}"></button>`).join('');
        const db = [...dots.children]; db.forEach((d, k) => d.onclick = () => E[k].scrollIntoView({ behavior: 'smooth' }));
        const io = new IntersectionObserver(en => en.forEach(x => { if (x.isIntersecting) { const k = E.indexOf(x.target); db.forEach(d => d.classList.remove('active')); db[k].classList.add('active'); cnt.textContent = String(k + 1).padStart(2, '0') + ' / ' + E.length } }), { root: D, threshold: .5 });
        E.forEach(e => io.observe(e));
        D.addEventListener('scroll', () => { const m = D.scrollHeight - D.clientHeight; pf.style.width = (m > 0 ? D.scrollTop / m * 100 : 0) + '%' });
        const gd = d => D.scrollBy({ top: d * D.clientHeight, behavior: 'smooth' });
        pv.onclick = () => gd(-1); nx.onclick = () => gd(1);
        addEventListener('keydown', e => { if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); gd(1) } if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); gd(-1) } });
    </script>
